  if (!force && __API_TOKEN__ && (__TOKEN_EXP__ - Date.now() / 1000) > 30) return;
  const r = await fetch('/api/session', { cache: 'no-store', headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error('session ' + r.status);

// Map API work → frontend format (sampleImages → images for modal)
function mapWork(w) {
  const images = [];
  if (w.cover && w.cover.large) {
    images.push({ type: 'cover', url: w.cover.large });
  }
  if (w.cover && w.cover.medium) {
    images.push({ type: 'cover', url: w.cover.medium });
  }
  if (w.sampleImages && w.sampleImages.length) {
    w.sampleImages.forEach(s => {
      if (s.largeUrl) images.push({ type: 'sample', url: s.largeUrl });
    });
  }
  return Object.assign({}, w, { images });
}

function mapResponse(data) {
  if (!data || !data.works) return data;
  return Object.assign({}, data, {
    works: data.works.map(mapWork),
  });
}

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getRecentDates() {
  const dates = [];
  const now = new Date();
  const todayStr = fmtDate(now);
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 86400000);
    dates.push(fmtDate(d));
  }
  return { dates, todayStr };
}
const DATES = getRecentDates().dates;
const TODAY = getRecentDates().todayStr;

// ========== Timeline ==========
function renderTimeline() {
  const track = document.getElementById('timeline-track');
  track.innerHTML = '';
  DATES.forEach((d, i) => {
    const isToday = d === TODAY;
    const day = document.createElement('div');
    day.className = 'timeline-day' + (i === currentDateIdx ? ' active' : '') + (isToday ? ' is-today' : '');
    day.innerHTML =
      `<div class="timeline-date">${d.slice(5)}</div>` +
      `<div class="timeline-dow">${['日','一','二','三','四','五','六'][new Date(d + 'T00:00:00').getDay()]}</div>`;
    day.onclick = () => selectDate(i);
    track.appendChild(day);
  });
  scrollToActive();
}

function scrollToActive() {
  const track = document.getElementById('timeline-track');
  const active = track.querySelector('.timeline-day.active');
  if (active) {
    active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
}

// drag-to-scroll
let dragStartX = 0, dragScrollLeft = 0, dragging = false, dragged = false;
function initDrag() {
  const track = document.getElementById('timeline-track');
  track.addEventListener('pointerdown', e => {
    dragging = true;
    dragged = false;
    dragStartX = e.clientX;
    dragScrollLeft = track.scrollLeft;
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 5) {
      dragged = true;
      track.scrollLeft = dragScrollLeft - dx;
    }
  });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('pointercancel', () => { dragging = false; });

  // suppress the click that follows a real drag, so day selection still works
  track.addEventListener('click', e => {
    if (dragged) {
      e.stopPropagation();
      e.preventDefault();
      dragged = false;
    }
  }, true);
}

function selectDate(idx) {
  currentDateIdx = idx;
  currentPage = 0;
  renderTimeline();
  loadTodayData();
}

function openCalendar() {
  const input = document.getElementById('calendar-input');
  input.value = DATES[currentDateIdx];
  if (typeof input.showPicker === 'function') {
    input.showPicker();
  } else {
    input.click();
  }
}
function onCalendarChange() {
  const input = document.getElementById('calendar-input');
  const val = input.value;
  if (!val) return;
  if (val > TODAY) { input.value = TODAY; return; }
  if (!DATES.includes(val)) {
    DATES.push(val);
    DATES.sort();
  }
  currentDateIdx = DATES.indexOf(val);
  currentPage = 0;
  renderTimeline();
  loadTodayData();
}

async function actionFetch(url) {
  await refreshSession();
  let res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ } });

    await refreshSession(true);
    res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ } });
  }
  if (!res.ok) throw new Error('API ' + res.status);
  return res.json();
}

function dateVal(m) {
  const ts = +m.date;
  if (m.date === ts) return ts;
  const n = parseInt(String(m.date_str || m.date || '').replace(/[^\d]/g, ''), 10);
  return isNaN(n) ? 0 : n;
}

const HD_PATTERNS = [
  { re: /\b4K\b|\b2160p\b|\bUHD\b/i, text: '4K', cls: 'hd' },
  { re: /\b1080p\b|\bFHD\b/i, text: '1080p', cls: 'hd' },
  { re: /\b720p\b/i, text: '720p', cls: 'tx' },
  { re: /\bH265\b|\bHEVC\b|\bHVC\b/i, text: 'H265', cls: 'co' },
  { re: /\bH264\b|\bAVC\b/i, text: 'H264', cls: 'co' },
  { re: /\bBlu[- ]?ray\b/i, text: 'BD', cls: 'co' },
];

function hdTags(name, extraTags) {
  const s = String(name || '');
  const seen = {};
  const out = [];
  for (const p of HD_PATTERNS) {
    if (p.re.test(s) && !seen[p.text]) { seen[p.text] = 1; out.push({ text: p.text, cls: p.cls }); }
  }
  if (Array.isArray(extraTags)) {
    for (const tg of extraTags) {
      const tx = String(tg).trim();
      if (tx && !seen[tx]) { seen[tx] = 1; out.push({ text: tx, cls: 'hd' }); }
    }
  }
  return out.slice(0, 4);
}

function magnetRow(m) {
  const tags = hdTags(m.name, m.tags);
  const tagHtml = tags.map(tg => `<span class="ap-tag ${tg.cls}">${escHtml(tg.text)}</span>`).join('');
  const files = m.files != null && m.files > 0 ? `${m.files} ${t('files')}` : '—';
  return `
    <div class="ap-row ap-magnet" data-magnet="${escAttr(m.magnet)}">
      <div class="ap-name">${escHtml(m.name)}</div>
      ${tagHtml ? `<div class="ap-tag-line">${tagHtml}</div>` : ''}
      <div class="ap-meta">
        <span>${escHtml(m.size || '')}</span>
        <span>${escHtml(files)}</span>
        <span>${escHtml(m.date_str || '')}</span>
        <span class="ap-copy">${t('copy')}</span>
      </div>
    </div>`;
}

function copyMagnet(magnet, rowEl) {
  const badge = rowEl.querySelector('.ap-copy');
  const done = () => {
    badge.classList.add('done');
    badge.textContent = t('copied');
    setTimeout(() => { badge.classList.remove('done'); badge.textContent = t('copy'); }, 1600);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = magnet;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (_) { window.prompt(t('copy'), magnet); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(magnet).then(done).catch(fallback);
  } else {
    fallback();
  }
}

let toastTimer = null;

// Click a 番号 (works list or modal footer) to copy it to the clipboard.
function copyCode(el) {
  const code = String(el.dataset.code || el.textContent || '').trim();
  if (!code) return;
  const done = () => {
    el.classList.add('copied');
    showCopyToast(t('copied'));
    setTimeout(() => el.classList.remove('copied'), 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(done).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
      done();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = code;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
    done();
  }
}

    return `
      <div class="card fade-in" style="animation-delay:${i*30}ms"
        onclick="handleCardClick(event, this, ${escAttr(JSON.stringify({images:w.images||[],title:w.title,code,date:fmtRelease(w.deliveryStartAt)}))})">
        <img class="card-img" src="${w.cover.medium || w.cover.large || ''}" alt="${escAttr(w.title || '')}" loading="lazy"
          onerror="this.style.background='linear-gradient(135deg,var(--border),var(--border))'">
        <div class="card-body">
          ${rankHtml}
          <div class="card-title">${escHtml(w.title)}</div>
          <div class="card-sub">
            ${codeHtml}
            ${dateHtml}
          </div>
          <div class="card-meta">
            <span class="card-tag">${escHtml(w.maker?.name || '')}</span>
            ${actresses ? `<span class="card-tag">${escHtml(actresses)}</span>` : ''}
            ${bookmarkHtml}
            ${w.review?.count ? `<span class="card-tag">★ ${w.review.average}</span>` : ''}
          </div>
          ${priceHtml}
        </div>
      </div>`;
  }).join('');
  renderPagination(data);
}

function fmtRelease(s) {
  return String(s || '').slice(0, 10);
}

// Convert a DMM CID (e.g. "1dldss00515", "h_086jrze00318") to its 番号 code:
// uppercase maker + "-" + serial number.
// Serial leading zeros are stripped, but the result must stay at least 3 digits,
// so zeros are re-added only when the effective value would be shorter than 3.
// e.g. 1dldss00515 -> DLDSS-515, 1fns00241 -> FNS-241, 1abc00100 -> ABC-100, 1abc10 -> ABC-010
function cidToCode(cid) {
  let s = String(cid || '').trim().toLowerCase();
  if (!s) return '';
  if (s.startsWith('h_')) s = s.slice(2);
  const m = s.match(/(\d+)$/);
  const num = m ? m[1] : '';
  const rest = num ? s.slice(0, s.length - num.length) : s;
  const maker = rest.replace(/^\d+/, '').toUpperCase();
  if (!maker) return cid;
  let digits = num.replace(/^0+/, '');
  if (!digits) digits = '0';
  while (digits.length < 3) digits = '0' + digits;
  return maker + '-' + digits;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ========== Pagination ==========
function renderPagination(data) {
  const el = document.getElementById('pagination');
  if (!data) { el.innerHTML = ''; return; }
  const page = Math.floor(data.offset / data.limit) + 1;
  const totalPages = Math.ceil(data.total / data.limit);
  el.innerHTML = `
    <button class="page-btn" onclick="prevPage()" ${data.offset === 0 ? 'disabled' : ''}>${t('prev')}</button>
    <span class="page-info">${page} / ${totalPages}</span>
    <button class="page-btn" onclick="nextPage()" ${!data.hasNext ? 'disabled' : ''}>${t('next')}</button>`;
}
function prevPage() { if (currentPage > 0) { currentPage--; loadCurrentData(); } }
function nextPage() { currentPage++; loadCurrentData(); }

// ========== Data Loading ==========
let loadSeq = 0;
let abortCtrl = null;

async function loadData(url) {
  const seq = ++loadSeq;
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  const container = document.getElementById('cards');
  container.innerHTML = `<div class="status-msg">${t('loading')}</div>`;

  const doFetch = async () => {
    await refreshSession();
    const res = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ },
      signal: abortCtrl.signal,
    });
    if (res.status === 401 || res.status === 403) {
      await refreshSession(true);
      return null;
    }
    if (!res.ok) throw new Error('API ' + res.status);
    return res.json();
  };

  try {
    let data = await doFetch();
    if (data === null) data = await doFetch();
    if (seq !== loadSeq) return;
    renderCards(mapResponse(data));
  } catch (e) {
    if (e.name === 'AbortError' || seq !== loadSeq) return;
    console.warn('API unavailable, using mock data:', e.message);
    renderCards(currentMode === 'today'
      ? mockTodayData(DATES[currentDateIdx], currentPage * PAGE_SIZE, PAGE_SIZE)
      : mockRankingData(currentPage * PAGE_SIZE, PAGE_SIZE));
  }
}

async function loadTodayData() {
  const date = DATES[currentDateIdx];
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/todayupdate?date=${date}&offset=${offset}&limit=${PAGE_SIZE}`);
}

async function loadRankingData() {
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/ranking?offset=${offset}&limit=${PAGE_SIZE}`);
}
function loadCurrentData() {
  currentMode === 'today' ? loadTodayData() : loadRankingData();
}

// ========== Mode Switch ==========
function switchMode(mode) {
  currentMode = mode;
  currentPage = 0;
  document.getElementById('btn-today').classList.toggle('active', mode === 'today');
  document.getElementById('btn-ranking').classList.toggle('active', mode === 'ranking');
  document.getElementById('timeline-section').style.display = mode === 'today' ? '' : 'none';
  document.getElementById('header-sub').textContent =
    mode === 'today' ? t('subtitle_today') : t('subtitle_ranking');
  loadCurrentData();
}

// ========== 18+ / NSFW Gate ==========
function confirmGate() {
  if (document.getElementById('gate-remember').checked) {
    localStorage.setItem('dm9_age_ok', '1');
  }
  document.getElementById('gate').classList.remove('open');
  document.body.classList.remove('gated');
  initApp();
}

function leaveGate() {
  window.location.href = 'about:blank';
}

function checkGate() {
  const already = localStorage.getItem('dm9_age_ok') === '1';
  if (already) {
    document.body.classList.remove('gated');
    initApp();
  } else {
    document.getElementById('gate').classList.add('open');
    document.documentElement.style.overflow = 'hidden';
  }
}

// ========== Init ==========
function initApp() {
  document.documentElement.style.overflow = '';
  document.getElementById('calendar-input').max = TODAY;
  renderTimeline();
  applyTheme();
  applyBrowse();
  applyLang();
  initDrag();
  loadTodayData();
}

checkGate();
</script>
