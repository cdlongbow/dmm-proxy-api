// Map API work → frontend format (sampleImages → images for modal)
function mapWork(w, source) {
  const isJavbus = String(source || '').toLowerCase() === 'javbus';
  const images = [];
  // javbus covers (www.javbus.com/pics/...) are CORS-blocked in the browser;
  // skip them in the modal (the card shows a local placeholder instead).
  if (!isJavbus && w.cover && w.cover.large) {
    images.push({ type: 'cover', url: w.cover.large });
  }
  if (!isJavbus && w.cover && w.cover.medium) {
    images.push({ type: 'cover', url: w.cover.medium });
  }
  if (w.sampleImages && w.sampleImages.length) {
    w.sampleImages.forEach(s => {
      if (s.largeUrl) images.push({ type: 'sample', url: s.largeUrl });
    });
  }
  return Object.assign({}, w, { images });
}

function mapResponse(data) {
  if (!data || !data.works) return data;
  return Object.assign({}, data, {
    works: data.works.map(w => mapWork(w, data.source)),
  });
}

    if (isNaN(d.getTime())) return str.slice(0, 10).replace(/-/g, '/');
    const j = new Date(d.getTime() + 9 * 3600 * 1000);
    const p = n => String(n).padStart(2, '0');
    return `${j.getUTCFullYear()}/${p(j.getUTCMonth() + 1)}/${p(j.getUTCDate())}`;
  }
  return str.slice(0, 10).replace(/-/g, '/');
}

// ========== State ==========
let currentMode = 'today';
let currentDateIdx = 29;
let currentPage = 0;
const PAGE_SIZE = 30;
let currentSearch = '';
let lastMode = 'today';
let modalImages = [];
let modalIdx = 0;

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getRecentDates() {
  const dates = [];
  const now = new Date();
  const todayStr = fmtDate(now);
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 86400000);
    dates.push(fmtDate(d));
  }
  return { dates, todayStr };
}
const DATES = getRecentDates().dates;
const TODAY = getRecentDates().todayStr;

// ========== Timeline ==========
function renderTimeline() {
  const track = document.getElementById('timeline-track');
  track.innerHTML = '';
  DATES.forEach((d, i) => {
    const isToday = d === TODAY;
    const day = document.createElement('div');
    day.className = 'timeline-day' + (i === currentDateIdx ? ' active' : '') + (isToday ? ' is-today' : '');
    day.innerHTML =
      `<div class="timeline-date">${d.slice(5)}</div>` +
      `<div class="timeline-dow">${['日','一','二','三','四','五','六'][new Date(d + 'T00:00:00').getDay()]}</div>`;
    day.onclick = () => selectDate(i);
    track.appendChild(day);
  });
  scrollToActive();
}

function scrollToActive() {
  const track = document.getElementById('timeline-track');
  const active = track.querySelector('.timeline-day.active');
  if (active) {
    active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
}

// drag-to-scroll
let dragStartX = 0, dragScrollLeft = 0, dragging = false, dragged = false;
function initDrag() {
  const track = document.getElementById('timeline-track');
  track.addEventListener('pointerdown', e => {
    dragging = true;
    dragged = false;
    dragStartX = e.clientX;
    dragScrollLeft = track.scrollLeft;
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 5) {
      dragged = true;
      track.scrollLeft = dragScrollLeft - dx;
    }
  });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('pointercancel', () => { dragging = false; });

  // suppress the click that follows a real drag, so day selection still works
  track.addEventListener('click', e => {
    if (dragged) {
      e.stopPropagation();
      e.preventDefault();
      dragged = false;
    }
  }, true);
}

function selectDate(idx) {
  currentDateIdx = idx;
  currentPage = 0;
  renderTimeline();
  syncModeButtons();
  loadTodayData();
  updateHash();
}

// ========== Calendar popover ==========
// Native <input type="date"> pickers anchor themselves wherever the browser
// chooses, which can push the popup off-screen on mobile. We render our own
// calendar anchored to the left of the 📅 button instead.
let calViewYear = 0, calViewMonth = 0; // viewport year/month (1-12) shown
function openCalendar() {
  const base = (DATES[currentDateIdx] || TODAY);
  const [y, m] = base.split('-').map(Number);
  calViewYear = y; calViewMonth = m;
  renderCalendar();
  document.getElementById('calendar-popover').classList.add('open');
}
function closeCalendar() {
  document.getElementById('calendar-popover').classList.remove('open');
  const input = document.getElementById('cp-date-input');
  if (input) input.value = '';
}
function calMove(dir) {
  let m = calViewMonth + dir, y = calViewYear;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  calViewYear = y; calViewMonth = m;
  renderCalendar();
}
function calJump(dir) {
  calViewYear += dir;
  renderCalendar();
}
function renderCalendar() {
  const title = document.getElementById('cp-title');
  const grid = document.getElementById('cp-grid');
  document.getElementById('cp-today-btn').textContent = t('cal_today');
  const inputEl = document.getElementById('cp-date-input');
  if (inputEl && inputEl.placeholder !== t('cal_ph')) inputEl.placeholder = t('cal_ph');
  const now = new Date(calViewYear, calViewMonth - 1, 1);
  const firstDow = now.getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth, 0).getDate();
  title.textContent = `${calViewYear}-${String(calViewMonth).padStart(2, '0')}`;
  const dows = currentLang === 'zh' ? ['日','一','二','三','四','五','六'] : ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let html = '';
  dows.forEach(w => { html += `<span class="cp-dow">${w}</span>`; });
  for (let i = 0; i < firstDow; i++) html += '<span></span>';
  for (let d = 1; d <= daysInMonth; d++) {
    const val = `${calViewYear}-${String(calViewMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const future = val > TODAY;
    const sel = val === (DATES[currentDateIdx] || TODAY);
    const today = val === TODAY;
    let cls = 'cp-d' + (future ? ' dis' : '') + (sel ? ' sel' : '') + (today ? ' today' : '');
    html += `<span class="${cls}" data-v="${val}" ${future ? '' : `onclick="pickCalendarDate('${val}')"`}>${d}</span>`;
  }
  grid.innerHTML = html;
}
function pickCalendarDate(val) {
  closeCalendar();
  if (!val || val > TODAY) return;
  if (!DATES.includes(val)) {
    DATES.push(val);
    DATES.sort();
  }
  currentDateIdx = DATES.indexOf(val);
  currentPage = 0;
  renderTimeline();
  syncModeButtons();
  loadTodayData();
  updateHash();
}

// ========== Calendar date input (type-a-date) ==========
// Accepts YYYY-MM-DD, YYYYMMDD, or YYYY-M-D; Enter/change picks the date.
function onCpInputKey(e) {
  if (e.key === 'Enter') pickTypedDate();
}
function pickTypedDate() {
  const input = document.getElementById('cp-date-input');
  const raw = (input.value || '').trim();
  if (!raw) return;
  const val = parseDateInput(raw);
  if (!val) { input.select(); return; }
  if (val > TODAY) { input.select(); return; }
  closeCalendar();
  if (!DATES.includes(val)) {
    DATES.push(val);
    DATES.sort();
  }
  currentDateIdx = DATES.indexOf(val);
  currentPage = 0;
  renderTimeline();
  syncModeButtons();
  loadTodayData();
  updateHash();
}
function parseDateInput(s) {
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  let Y, MO, D;
  if (m) {
    Y = +m[1]; MO = +m[2]; D = +m[3];
  } else {
    m = s.match(/^(\d{8})$/);
    if (!m) return null;
    Y = +s.slice(0, 4); MO = +s.slice(4, 6); D = +s.slice(6, 8);
  }
  const dt = new Date(Y, MO - 1, D);
  if (dt.getFullYear() !== Y || dt.getMonth() !== MO - 1 || dt.getDate() !== D) return null;
  return `${Y}-${String(MO).padStart(2, '0')}-${String(D).padStart(2, '0')}`;
}

// ========== Modal ==========
function openModal(work, idx) {
  modalImages = work.images || [];
  if (modalImages.length === 0) return;
  modalIdx = (typeof idx === 'number' && idx >= 0 && idx < modalImages.length) ? idx : 0;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('modal-title').textContent = work.title || '';
  const codeEl = document.getElementById('modal-code');
  codeEl.textContent = work.code || '';
  codeEl.dataset.code = work.code || '';
  codeEl.title = work.code ? t('copy') : '';
  document.getElementById('modal-date').textContent = work.date ? ' · ' + work.date : '';
  currentCode = work.code || '';
  updateActionButtons();
  closePopover();
  updateModal();
}
// Open the sample browser (modal) starting at the i-th sample image so the
// user can walk through all large shots; the modal already carries the
// 磁力链接 / 跳转播放 action buttons tied to currentCode.
function openSampleModal(imgs, si) {
  const gallery = imgs.images || [];
  let cur = -1;
  for (let k = 0; k < gallery.length; k++) {
    if (gallery[k].type === 'sample') cur++;
    if (cur === si) { openModal(imgs, k); return; }
  }
  openModal(imgs, 0);
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  closePopover();
}
function modalPrev() {
  if (modalIdx > 0) { modalIdx--; updateModal(); }
}
function modalNext() {
  if (modalIdx < modalImages.length - 1) { modalIdx++; updateModal(); }
}
function updateModal() {
  const img = modalImages[modalIdx];
  document.getElementById('modal-img').src = img ? img.url : '';
  document.getElementById('modal-counter').textContent = `${modalIdx + 1} / ${modalImages.length}`;
  const badge = document.getElementById('modal-badge');
  badge.textContent = img && img.type === 'cover' ? t('cover') : t('sample');
  document.querySelector('.modal-arrow.left').style.visibility = modalIdx > 0 ? '' : 'hidden';
  document.querySelector('.modal-arrow.right').style.visibility = modalIdx < modalImages.length - 1 ? '' : 'hidden';
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') modalPrev();
  if (e.key === 'ArrowRight') modalNext();
});

// ========== Modal Action Buttons (Magnet / Findplay) ==========
let currentCode = '';
let fetching = false;
let magnetData = [];

function updateActionButtons() {
  const dis = !currentCode;
  document.getElementById('btn-magnet').disabled = dis;
  document.getElementById('btn-play').disabled = dis;
}

function closePopover() {
  document.getElementById('action-popover').classList.remove('open');
  document.getElementById('btn-magnet').classList.remove('active');
  document.getElementById('btn-play').classList.remove('active');
}

function toggleAction(kind) {
  const po = document.getElementById('action-popover');
  const wasOpen = po.classList.contains('open') && po.dataset.kind === kind;
  closePopover();
  if (wasOpen || !currentCode) return;
  po.dataset.kind = kind;
  document.getElementById(kind === 'magnet' ? 'btn-magnet' : 'btn-play').classList.add('active');
  po.classList.add('open');
  po.innerHTML = `<div class="ap-status">⏳ ${t('fetching')}</div>`;
  if (kind === 'magnet') loadMagnets(); else loadFindplay();
}

function setBusy(btnId, busy) {
  const btn = document.getElementById(btnId);
  const ico = btn.querySelector('.action-ico');
  if (busy) ico.dataset.prev = ico.textContent;
  ico.textContent = busy ? '⟳' : (ico.dataset.prev || ico.textContent);
  ico.classList.toggle('spin', busy);
  btn.disabled = busy;
}

async function actionFetch(url) {
  await refreshSession();
  let res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ } });
  if (res.status === 401 || res.status === 403) {
    await refreshSession(true);
    res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ } });
  }
  if (!res.ok) throw new Error('API ' + res.status);
  return res.json();
}

async function loadMagnets() {
  if (fetching) return;
  fetching = true;
  setBusy('btn-magnet', true);
  const po = document.getElementById('action-popover');
  try {
    const data = await actionFetch(`/api/magnet/${encodeURIComponent(currentCode)}`);
    magnetData = data.sources || [];
    renderMagnetTabs();
  } catch (e) {
    po.innerHTML = `<div class="ap-status">${t('load_failed')}</div>`;
  } finally {
    fetching = false;
    setBusy('btn-magnet', false);
  }
}

async function retryMagnetChannel(i) {
  const src = magnetData[i];
  if (!src) return;
  const pane = document.getElementById('ap-pane-' + i);
  if (pane) pane.innerHTML = `<div class="ap-state-loading ap-status">${t('loading')}</div>`;
  const btn = document.querySelector(`#action-popover .ap-tab[data-idx="${i}"]`);
  if (btn) btn.classList.add('busy');
  try {
    const data = await actionFetch(`/api/magnet/${encodeURIComponent(currentCode)}?s=${encodeURIComponent(src.source)}`);
    const fresh = (data.sources || []).find(x => String(x.source).toLowerCase() === String(src.source).toLowerCase());
    magnetData[i] = fresh || src;
    renderMagnetPane(i);
  } catch (e) {
    if (pane) pane.innerHTML = `<div class="ap-status">${t('load_failed')}</div>` +
      `<button class="ap-retry" onclick="retryMagnetChannel(${i})">${t('retry_channel')}</button>`;
  } finally {
    if (btn) btn.classList.remove('busy');
  }
}

async function renderMagnetTabs() {
  const po = document.getElementById('action-popover');
  const anyMagnet = magnetData.some(s => Array.isArray(s.magnets) && s.magnets.length > 0);
  if (!magnetData.length || !anyMagnet) {
    po.innerHTML = `<div class="ap-status">${t('magnet_none')}</div>` +
      `<button class="ap-retry" onclick="loadMagnets()">${t('retry_channel')}</button>`;
    return;
  }
  const tabs = magnetData.map((s, i) =>
    `<button class="ap-tab${i === 0 ? ' active' : ''}" data-idx="${i}" onclick="selectMagnetTab(${i})">${escHtml(String(s.source || '').toUpperCase())}<span class="ap-tab-cnt">${s.count != null ? s.count : (s.magnets || []).length}</span></button>`
  ).join('');
  po.innerHTML = `<div class="ap-tabs">${tabs}</div>` +
    magnetData.map((_, i) => `<div class="ap-pane${i === 0 ? ' active' : ''}" id="ap-pane-${i}"></div>`).join('');
  magnetData.forEach((_, i) => renderMagnetPane(i));
}

function selectMagnetTab(i) {
  document.querySelectorAll('#action-popover .ap-tab').forEach((b, k) => b.classList.toggle('active', k === i));
  document.querySelectorAll('#action-popover .ap-pane').forEach((p, k) => p.classList.toggle('active', k === i));
}

function renderMagnetPane(i) {
  const src = magnetData[i];
  const pane = document.getElementById('ap-pane-' + i);
  const mags = Array.isArray(src.magnets) ? src.magnets.slice() : [];
  mags.sort((a, b) => dateVal(b) - dateVal(a));
  if (!mags.length) {
    pane.innerHTML = `<div class="ap-status">${escHtml(src.error || t('magnet_none'))}</div>` +
      `<button class="ap-retry" onclick="retryMagnetChannel(${i})">${t('retry_channel')}</button>`;
    return;
  }
  pane.innerHTML = mags.map(magnetRow).join('');
  pane.querySelectorAll('.ap-magnet').forEach(el => {
    el.addEventListener('click', () => copyMagnet(el.dataset.magnet, el));
  });
}

function dateVal(m) {
  const ts = +m.date;
  if (m.date === ts) return ts;
  const n = parseInt(String(m.date_str || m.date || '').replace(/[^\d]/g, ''), 10);
  return isNaN(n) ? 0 : n;
}

const HD_PATTERNS = [
  { re: /\b4K\b|\b2160p\b|\bUHD\b/i, text: '4K', cls: 'hd' },
  { re: /\b1080p\b|\bFHD\b/i, text: '1080p', cls: 'hd' },
  { re: /\b720p\b/i, text: '720p', cls: 'tx' },
  { re: /\bH265\b|\bHEVC\b|\bHVC\b/i, text: 'H265', cls: 'co' },
  { re: /\bH264\b|\bAVC\b/i, text: 'H264', cls: 'co' },
  { re: /\bBlu[- ]?ray\b/i, text: 'BD', cls: 'co' },
];

function hdTags(name, extraTags) {
  const s = String(name || '');
  const seen = {};
  const out = [];
  for (const p of HD_PATTERNS) {
    if (p.re.test(s) && !seen[p.text]) { seen[p.text] = 1; out.push({ text: p.text, cls: p.cls }); }
  }
  if (Array.isArray(extraTags)) {
    for (const tg of extraTags) {
      const tx = String(tg).trim();
      if (tx && !seen[tx]) { seen[tx] = 1; out.push({ text: tx, cls: 'hd' }); }
    }
  }
  return out.slice(0, 4);
}

function magnetRow(m) {
  const tags = hdTags(m.name, m.tags);
  const tagHtml = tags.map(tg => `<span class="ap-tag ${tg.cls}">${escHtml(tg.text)}</span>`).join('');
  const files = m.files != null && m.files > 0 ? `${m.files} ${t('files')}` : '—';
  return `
    <div class="ap-row ap-magnet" data-magnet="${escAttr(m.magnet)}">
      <div class="ap-name">${escHtml(m.name)}</div>
      ${tagHtml ? `<div class="ap-tag-line">${tagHtml}</div>` : ''}
      <div class="ap-meta">
        <span>${escHtml(m.size || '')}</span>
        <span>${escHtml(files)}</span>
        <span>${escHtml(m.date_str || '')}</span>
        <span class="ap-copy">${t('copy')}</span>
      </div>
    </div>`;
}

function copyMagnet(magnet, rowEl) {
  const badge = rowEl.querySelector('.ap-copy');
  const done = () => {
    badge.classList.add('done');
    badge.textContent = t('copied');
    setTimeout(() => { badge.classList.remove('done'); badge.textContent = t('copy'); }, 1600);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = magnet;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (_) { window.prompt(t('copy'), magnet); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(magnet).then(done).catch(fallback);
  } else {
    fallback();
  }
}

let toastTimer = null;
function showCopyToast(msg) {
  let el = document.getElementById('code-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'code-toast';
    el.className = 'code-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
}

// Click a 番号 (works list or modal footer) to copy it to the clipboard.
function copyCode(el) {
  const code = String(el.dataset.code || el.textContent || '').trim();
  if (!code) return;
  const done = () => {
    el.classList.add('copied');
    showCopyToast(t('copied'));
    setTimeout(() => el.classList.remove('copied'), 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(done).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
      done();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = code;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
    done();
  }
}

document.addEventListener('click', e => {
  const pop = document.getElementById('calendar-popover');
  if (pop && pop.classList.contains('open') &&
      !pop.contains(e.target) && !e.target.closest('.calendar-btn')) {
    closeCalendar();
  }
  const el = e.target.closest('.card-id');
  if (!el) return;
  e.preventDefault();
  e.stopPropagation();
  copyCode(el);
});

async function loadFindplay() {
  if (fetching) return;
  fetching = true;
  setBusy('btn-play', true);
  const po = document.getElementById('action-popover');
  try {
    const data = await actionFetch(`/api/findplay/${encodeURIComponent(currentCode)}`);
    const results = data.results || [];
    const rows = results.map(r => {
      if (r.playable) {
        return `<a class="ap-row" href="${escAttr(r.url)}" target="_blank" rel="noopener"><span>${escHtml(r.label)}</span><span class="ap-badge ok">▶ ${t('play_ok')}</span></a>`;
      }
      if (r.verified) {
        return `<div class="ap-row ap-disabled"><span>${escHtml(r.label)}</span><span class="ap-badge no">${t('play_no')}</span></div>`;
      }
      return `<a class="ap-row ap-fail" href="${escAttr(r.url)}" target="_blank" rel="noopener"><span>${escHtml(r.label)}</span><span class="ap-badge warn">${t('play_warn')}</span></a>`;
    }).join('');
    const hasProbeFail = results.some(r => !r.playable && !r.verified);
    const hint = hasProbeFail ? `<div class="ap-hint">${t('probe_hint')}</div>` : '';
    po.innerHTML = (rows || `<div class="ap-status">${t('play_none')}</div>`) + hint;
  } catch (e) {
    po.innerHTML = `<div class="ap-status">${t('load_failed')}</div>`;
  } finally {
    fetching = false;
    setBusy('btn-play', false);
  }
}

// ========== Cards ==========
function renderCards(data) {
  const container = document.getElementById('cards');
  const titleEl = document.getElementById('content-title');
  const countEl = document.getElementById('content-count');

  if (!data || !data.works || data.works.length === 0) {
    container.innerHTML = `<div class="status-msg">${t('no_data')}</div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const isRanking = currentMode === 'ranking';
  if (currentMode === 'search' && data.keyword) {
    titleEl.textContent = t('search_title', data.keyword);
  } else if (isRanking) {
    titleEl.textContent = t('ranking');
  } else {
    titleEl.textContent = t('updates', data.date);
  }
  countEl.textContent = t('total', data.total);

  container.innerHTML = data.works.map((w, i) => {
    const actresses = Array.isArray(w.actresses) ? w.actresses.map(a => a && a.name).filter(Boolean).join(' / ') : '';
    const rankHtml = isRanking ? `<div class="card-rank">#${w.rank}</div>` : '';
    const priceHtml = w.price
      ? `<div class="card-price">${w.price.price}円${w.price.discountPrice ? `<span class="original">${w.price.discountPrice}円</span>` : ''}</div>`
      : '';
    const bookmarkHtml = isRanking && w.bookmarkCount
      ? `<span class="card-tag">♥ ${w.bookmarkCount.toLocaleString()}</span>` : '';
    const genresHtml = currentMode === 'search' && Array.isArray(w.genres)
      ? w.genres.slice(0, 3).map(g => `<span class="card-tag tag-genre">${escHtml(g.name || '')}</span>`).join('')
      : '';
    const labelHtml = currentMode === 'search' && Array.isArray(w.label) && w.label[0]
      ? `<span class="card-tag tag-label">${escHtml(w.label[0].name || '')}</span>` : '';
    const code = cidToCode(w.id);
    const codeHtml = code ? `<span class="card-id" data-code="${escAttr(code)}" title="${escAttr(t('copy'))}">${escHtml(code)}</span>` : '';
    const dateHtml = w.deliveryStartAt ? `<span class="card-date">${escHtml(fmtRelease(w.deliveryStartAt))}</span>` : '';
    return `
      <div class="card fade-in" style="animation-delay:${i*30}ms"
        onclick="handleCardClick(event, this, ${escAttr(JSON.stringify({images:w.images||[],title:w.title,code,date:fmtRelease(w.deliveryStartAt)}))})">
        <img class="card-img" src="${w.cover.medium || w.cover.large || ''}" alt="${escAttr(w.title || '')}" loading="lazy"
          onerror="this.style.background='linear-gradient(135deg,var(--border),var(--border))'">
        <div class="card-body">
          ${rankHtml}
          <div class="card-title">${escHtml(w.title)}</div>
          <div class="card-sub">
            ${codeHtml}
            ${dateHtml}
          </div>
          <div class="card-meta">
            <span class="card-tag">${escHtml(w.maker?.name || '')}</span>
            ${actresses ? `<span class="card-tag">${escHtml(actresses)}</span>` : ''}
            ${bookmarkHtml}
            ${w.review?.count ? `<span class="card-tag">★ ${w.review.average}</span>` : ''}
            ${genresHtml}
            ${labelHtml}
          </div>
          ${priceHtml}
        </div>
      </div>`;
  }).join('');
  renderPagination(data);
}

function fmtRelease(s) {
  return String(s || '').slice(0, 10);
}

// Convert a DMM CID (e.g. "1dldss00515", "h_086jrze00318") to its 番号 code:
// uppercase maker + "-" + serial number.
// Serial leading zeros are stripped, but the result must stay at least 3 digits,
// so zeros are re-added only when the effective value would be shorter than 3.
// e.g. 1dldss00515 -> DLDSS-515, 1fns00241 -> FNS-241, 1abc00100 -> ABC-100, 1abc10 -> ABC-010
function cidToCode(cid) {
  let s = String(cid || '').trim().toLowerCase();
  if (!s) return '';
  if (s.startsWith('h_')) s = s.slice(2);
  const m = s.match(/(\d+)$/);
  const num = m ? m[1] : '';
  const rest = num ? s.slice(0, s.length - num.length) : s;
  const maker = rest.replace(/^\d+/, '').toUpperCase();
  if (!maker) return cid;
  let digits = num.replace(/^0+/, '');
  if (!digits) digits = '0';
  while (digits.length < 3) digits = '0' + digits;
  return maker + '-' + digits;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ========== Pagination ==========
function renderPagination(data) {
  const el = document.getElementById('pagination');
  if (!data) { el.innerHTML = ''; return; }
  const page = Math.floor(data.offset / data.limit) + 1;
  const totalPages = Math.ceil(data.total / data.limit);
  el.innerHTML = `
    <button class="page-btn" onclick="prevPage()" ${data.offset === 0 ? 'disabled' : ''}>${t('prev')}</button>
    <span class="page-info">${page} / ${totalPages}</span>
    <button class="page-btn" onclick="nextPage()" ${!data.hasNext ? 'disabled' : ''}>${t('next')}</button>`;
}
function prevPage() { if (currentPage > 0) { currentPage--; loadCurrentData(); } }
function nextPage() { currentPage++; loadCurrentData(); }

// ========== Data Loading ==========
let loadSeq = 0;
let abortCtrl = null;

// Discard any in-flight load: bump the sequence so a late response is dropped
// and abort the underlying fetch. Used on mode switches even when no new
// request follows, so a pending home response can never be rendered with the
// search layout (or vice versa).
function invalidatePendingRequests() {
  loadSeq++;
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = null;
}

async function loadData(url) {
  const seq = ++loadSeq;
  const modeAtStart = currentMode;
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  const container = document.getElementById('cards');
  container.innerHTML = `<div class="status-msg">${t('loading')}</div>`;

  const doFetch = async () => {
    await refreshSession();
    const res = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + __API_TOKEN__ },
      signal: abortCtrl.signal,
    });
    if (res.status === 401 || res.status === 403) {
      await refreshSession(true);
      return null;
    }
    if (!res.ok) throw new Error('API ' + res.status);
    return res.json();
  };

  try {
    let data = await doFetch();
    if (data === null) data = await doFetch();
    if (seq !== loadSeq || modeAtStart !== currentMode) return;
    const m = mapResponse(data);
    if (currentMode === 'search') {
      renderSearchResult(m);
    } else {
      renderCards(m);
    }
  } catch (e) {
    if (e.name === 'AbortError' || seq !== loadSeq || modeAtStart !== currentMode) return;
    console.warn('API unavailable, using mock data:', e.message);
    if (currentMode === 'search') {
      container.innerHTML = `<div class="status-msg">${t('load_failed')}</div>`;
      return;
    }
    renderCards(currentMode === 'today'
      ? mockTodayData(DATES[currentDateIdx], currentPage * PAGE_SIZE, PAGE_SIZE)
      : mockRankingData(currentPage * PAGE_SIZE, PAGE_SIZE));
  }
}

async function loadTodayData() {
  const date = DATES[currentDateIdx];
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/todayupdate?date=${date}&offset=${offset}&limit=${PAGE_SIZE}`);
}

async function loadRankingData() {
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/ranking?offset=${offset}&limit=${PAGE_SIZE}`);
}

function loadSearchData() {
  if (!currentSearch) {
    const container = document.getElementById('cards');
    document.getElementById('content-title').textContent = '';
    document.getElementById('content-count').textContent = '';
    container.innerHTML = `<div class="status-msg">${t('search_empty')}</div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  const offset = currentPage * PAGE_SIZE;
  loadData(`/api/search/${encodeURIComponent(currentSearch)}?offset=${offset}&hits=${PAGE_SIZE}`);
}

function enterSearchMode() {
  if (currentMode === 'today' || currentMode === 'ranking') {
    lastMode = currentMode;
  }
  currentMode = 'search';
  currentPage = 0;
  invalidatePendingRequests();
  document.getElementById('search-pill').classList.add('open');
  document.getElementById('timeline-section').style.display = 'none';
  syncModeButtons();
  updateSubtitle();
  const input = document.getElementById('search-input');
  if (currentSearch && !input.value) input.value = currentSearch;
  setTimeout(() => { input.focus(); input.select(); }, 60);
  updateHash();
}

function toggleSearchPill() {
  const pill = document.getElementById('search-pill');
  const wasOpen = pill.classList.contains('open');
  if (wasOpen) {
    pill.classList.remove('open');
    if (currentMode === 'search') {
      switchMode(lastMode in { today:1, ranking:1 } ? lastMode : 'today');
    }
    return;
  }
  enterSearchMode();
  loadSearchData();
}

function runSearch() {
  const input = document.getElementById('search-input');
  const val = input.value.trim().toUpperCase();
  if (!val) {
    input.focus();
    return;
  }
  currentMode = 'search';
  currentPage = 0;
  currentSearch = val;
  enterSearchMode();
  loadSearchData();
  updateHash();
}

function onSearchKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    runSearch();
  }
}

function updateSubtitle() {
  document.getElementById('header-sub').textContent =
    currentMode === 'today' ? t('subtitle_today')
    : currentMode === 'search' ? t('subtitle_search')
    : t('subtitle_ranking');
}

function loadCurrentData() {
  if (currentMode === 'search') {
    loadSearchData();
    return;
  }
  currentMode === 'today' ? loadTodayData() : loadRankingData();
}

// ========== Mode Switch ==========

// Persist the current view in location.hash so a page refresh / browser
// back-forward lands on the same interface: `#today`, `#today/2026-09-08`,
// `#ranking`, `#search`, `#search/ABF-365`. replaceState avoids polluting
// history and does not fire hashchange.
function updateHash() {
  let hash = `#${currentMode}`;
  if (currentMode === 'search' && currentSearch) {
    hash = `#search/${currentSearch}`;
  } else if (currentMode === 'today') {
    const d = DATES[currentDateIdx] || TODAY;
    if (d !== TODAY) hash = `#today/${d}`;
  }
  if (location.hash !== hash) history.replaceState(null, '', hash);
}

function goToday() {
  switchMode('today');
  const todayIdx = DATES.indexOf(TODAY);
  if (currentDateIdx !== todayIdx) {
    currentDateIdx = todayIdx;
    currentPage = 0;
    renderTimeline();
    syncModeButtons();
    loadTodayData();
  }
}

function syncModeButtons() {
  const todayActive = currentMode === 'today' && DATES[currentDateIdx] === TODAY;
  document.getElementById('btn-today').classList.toggle('active', todayActive);
  document.getElementById('btn-ranking').classList.toggle('active', currentMode === 'ranking');
  document.getElementById('btn-search').classList.toggle('active', currentMode === 'search');
}

function switchMode(mode) {
  currentMode = mode;
  currentPage = 0;
  invalidatePendingRequests();
  if (mode === 'today' || mode === 'ranking') {
    lastMode = mode;
    currentSearch = '';
    const input = document.getElementById('search-input');
    if (input) input.value = '';
  }
  document.getElementById('timeline-section').style.display = mode === 'today' ? '' : 'none';
  document.getElementById('search-pill').classList.toggle('open', mode === 'search');
  updateSubtitle();
  if (mode === 'today') {
    const todayIdx = DATES.indexOf(TODAY);
    if (currentDateIdx !== todayIdx) {
      currentDateIdx = todayIdx;
      renderTimeline();
    }
  }
  syncModeButtons();
  loadCurrentData();
  updateHash();
}

// ========== 18+ / NSFW Gate ==========
function confirmGate() {
  if (document.getElementById('gate-remember').checked) {
    localStorage.setItem('dm9_age_ok', '1');
  }
  document.getElementById('gate').classList.remove('open');
  document.body.classList.remove('gated');
  initApp();
}

function leaveGate() {
  window.location.href = 'about:blank';
}

function checkGate() {
  const already = localStorage.getItem('dm9_age_ok') === '1';
  if (already) {
    document.body.classList.remove('gated');
    initApp();
  } else {
    document.getElementById('gate').classList.add('open');
    document.documentElement.style.overflow = 'hidden';
  }
}

// ========== Init ==========
function initApp() {
  document.documentElement.style.overflow = '';
  document.getElementById('calendar-input').max = TODAY;
  renderTimeline();
  applyTheme();
  applyBrowse();
  applyLang();
  initDrag();

  // Restore the view saved in location.hash so a refresh lands on the same
  // interface (#today[/YYYY-MM-DD] / #ranking / #search[/番号]).
  const hash = location.hash.replace(/^#/, '');
  if (hash === 'ranking') {
    switchMode('ranking'); // switchMode loads the data itself
    return;
  }
  if (hash === 'today' || hash.startsWith('today/')) {
    const date = (hash.split('/')[1] || '').replace(/\s/g, '');
    if (date && /^\d{4}-\d{2}-\d{2}$/.test(date) && date <= TODAY) {
      // Same date-restore path as pickCalendarDate: unknown dates (outside the
      // recent 30-day window) are appended to DATES so the timeline shows them.
      currentDateIdx = DATES.indexOf(date);
      if (currentDateIdx === -1) {
        DATES.push(date);
        DATES.sort();
        currentDateIdx = DATES.indexOf(date);
      }
      currentPage = 0;
      document.getElementById('timeline-section').style.display = '';
      document.getElementById('search-pill').classList.remove('open');
      renderTimeline();
      syncModeButtons();
      updateSubtitle();
      loadTodayData();
      return;
    }
    switchMode('today');
    return;
  }
  if (hash.startsWith('search')) {
    const code = (hash.split('/')[1] || '').toUpperCase();
    if (code && !currentSearch) {
      currentSearch = code;
      document.getElementById('search-input').value = code;
    }
    enterSearchMode();
    loadSearchData();
    return;
  }
  loadTodayData();
}

checkGate();
